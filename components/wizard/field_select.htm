{# Select field of a wizard step. The selected option is restored from the
   saved value when the user returns to the step. Snowboard's FormValidation
   fills the bag below; see docs/standards.md for the ARIA contract. #}
<div class="wizard__field">
    <label class="wizard__label" for="{{ field.name }}">{{ field.label }}</label>

    <select class="wizard__select"
            id="{{ field.name }}"
            name="{{ field.name }}"
            aria-describedby="{{ field.name }}-error"
            {% for name, attributeValue in field.attributes %}{{ name }}="{{ attributeValue }}" {% endfor %}>
        <option value="">{{ 'zimudec.wizard::lang.fields.select_default' | trans }}</option>
        {% for optionValue, optionLabel in field.options %}
            <option value="{{ optionValue }}" {% if value == optionValue %}selected{% endif %}>{{ optionLabel }}</option>
        {% endfor %}
    </select>

    <div class="wizard__error" id="{{ field.name }}-error" role="alert" data-validate-error="{{ field.name }}" data-validate-for="{{ field.name }}"></div>
</div>
